<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Soliton Lab 1D</title><link rel='manifest' href='manifest.webmanifest'><meta name='theme-color' content='#f5f5f7'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='default'><meta name='apple-mobile-web-app-title' content='Soliton Lab'><link rel='apple-touch-icon' href='icon-180.png'><style>body{font-family:system-ui;margin:0;background:#f5f5f7;color:#1d1d1f}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 20px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}label{font-size:13px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:10px}button{padding:12px 18px;border:0;border-radius:12px;background:#111;color:white;font-weight:700;cursor:pointer}canvas{width:100%;height:360px;border-radius:12px;background:#fff}.stats{display:flex;gap:24px;flex-wrap:wrap}.small{color:#666;font-size:13px}</style></head><body><div class='wrap'><h1>Soliton Lab 1D</h1><p>Competencia entre difracción local y Riesz + no linealidad saturable.</p><div class='card'><div class='grid'><label>α<input id='alpha' type='number' value='1.5' step='.05'></label><label>s<input id='s' type='number' value='0.8' step='.1'></label><label>λ<input id='lam' type='number' value='0.6' step='.05'></label><label>c₁<input id='c1' type='number' value='1' step='.1'></label><label>c₂<input id='c2' type='number' value='1' step='.1'></label><label>L<input id='L' type='number' value='40' step='5'></label><label>N<input id='N' type='number' value='1024' step='256'></label></div><p><button id='find'>Find Soliton</button></p><div class='small'>Demo numérica autocontenida. Usa iteración espectral de punto fijo estabilizada; después podemos sustituirla por Petviashvili/Newton–Krylov.</div></div><div class='card'><div class='stats'><b id='power'>P = —</b><b id='err'>error = —</b><b id='iters'>iter = —</b></div><canvas id='plot' width='900' height='360'></canvas></div></div><script>
const $=id=>document.getElementById(id);
function dft(a,inv=false){let n=a.length,out=new Array(n),sg=inv?1:-1;for(let k=0;k<n;k++){let re=0,im=0;for(let j=0;j<n;j++){let th=sg*2*Math.PI*j*k/n,ar=a[j][0],ai=a[j][1];re+=ar*Math.cos(th)-ai*Math.sin(th);im+=ar*Math.sin(th)+ai*Math.cos(th)}out[k]=[re/(inv?n:1),im/(inv?n:1)]}return out}
function fft(a,inv=false){let n=a.length;if(n<=1)return a;if(n%2)return dft(a,inv);let ev=fft(a.filter((_,i)=>!(i%2)),inv),od=fft(a.filter((_,i)=>i%2),inv),out=new Array(n),sg=inv?1:-1;for(let k=0;k<n/2;k++){let th=sg*2*Math.PI*k/n,c=Math.cos(th),s=Math.sin(th),r=c*od[k][0]-s*od[k][1],q=s*od[k][0]+c*od[k][1];out[k]=[ev[k][0]+r,ev[k][1]+q];out[k+n/2]=[ev[k][0]-r,ev[k][1]-q]}if(inv)for(let i=0;i<n;i++){out[i][0]/=2;out[i][1]/=2}return out}
function plot(x,u){let c=$('plot'),g=c.getContext('2d'),W=c.width,H=c.height,p=35;g.clearRect(0,0,W,H);g.strokeStyle='#bbb';g.beginPath();g.moveTo(p,H-p);g.lineTo(W-p,H-p);g.moveTo(p,p);g.lineTo(p,H-p);g.stroke();let umax=Math.max(...u.map(Math.abs))*1.08||1;g.strokeStyle='#111';g.lineWidth=2;g.beginPath();u.forEach((v,i)=>{let X=p+(W-2*p)*i/(u.length-1),Y=H-p-(H-2*p)*(v/umax);i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke();g.fillStyle='#555';g.font='14px system-ui';g.fillText('x',W-p+5,H-p+5);g.fillText('U(x)',8,p);}
$('find').onclick=()=>{let alpha=+$('alpha').value,sat=+$('s').value,lam=+$('lam').value,c1=+$('c1').value,c2=+$('c2').value,L=+$('L').value,N=Math.max(64,Math.min(2048,+$('N').value));N=2**Math.round(Math.log2(N));let dx=2*L/N,x=Array.from({length:N},(_,j)=>(j-N/2)*dx),k=Array.from({length:N},(_,j)=>{let m=j<N/2?j:j-N;return 2*Math.PI*m/(2*L)});let u=x.map(xx=>Math.sqrt(Math.max(lam,0.1))*Math.exp(-xx*xx/4)),err=1,it=0;for(it=0;it<700&&err>1e-8;it++){let nl=u.map(v=>v*v*v/(1+sat*v*v));let F=fft(nl.map(v=>[v,0]));for(let j=0;j<N;j++){let den=lam+c1*k[j]*k[j]+c2*Math.pow(Math.abs(k[j]),alpha);F[j][0]/=den;F[j][1]/=den}let un=fft(F,true).map(z=>z[0]);let num=0,den=0;for(let j=0;j<N;j++){num+=(un[j]-u[j])**2;den+=u[j]**2}err=Math.sqrt(num/(den+1e-30));let relax=.35;u=u.map((v,j)=>(1-relax)*v+relax*un[j]);let mx=Math.max(...u.map(Math.abs));if(mx<1e-10){u=x.map(xx=>2*Math.sqrt(Math.max(lam,.1))*Math.exp(-xx*xx/2));}}
let P=u.reduce((a,v)=>a+v*v*dx,0);$('power').textContent='P = '+P.toPrecision(6);$('err').textContent='error = '+err.toExponential(2);$('iters').textContent='iter = '+it;plot(x,u)};
$('find').click();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
